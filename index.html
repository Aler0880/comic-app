<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SVG Комикс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #222222);
    --hint: var(--tg-theme-hint-color, #999999);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f1f1f1);
    --border: rgba(127,127,127,0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px 12px 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  button, textarea {
    font: inherit; font-size: 14px;
    padding: 9px 14px; border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card); color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--btn); color: var(--btn-text); border-color: transparent; font-weight: 600; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: .5; cursor: default; }
  .layout-group { display: inline-flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .layout-group button { border: none; border-radius: 0; padding: 9px 12px; }
  .layout-group button.active { background: var(--btn); color: var(--btn-text); }
  .story-box { display: flex; gap: 8px; margin-bottom: 12px; }
  .story-box textarea {
    flex: 1; font-size: 14px; resize: vertical; min-height: 44px;
    cursor: text;
  }
  .preview {
    background: var(--card); border-radius: 14px; padding: 12px;
    margin-bottom: 14px; overflow: auto; display: flex; justify-content: center;
  }
  .preview svg { max-width: 100%; height: auto; display: block; }
  .editor h2 {
    font-size: 13px; margin: 0 0 8px; color: var(--hint);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .frame-card { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .frame-card .label { font-size: 12px; color: var(--hint); margin-bottom: 6px; }
  .frame-card input {
    width: 100%; font: inherit; font-size: 14px;
    padding: 8px 10px; border-radius: 8px; margin-bottom: 6px;
    border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
  }
  .frame-card input:last-child { margin-bottom: 0; }
  .footer { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .footer button { flex: 1; min-width: 100px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: rgba(0,0,0,0.85); color: #fff; padding: 10px 18px;
    border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .25s; z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<h1>🎨 SVG Комикс</h1>

<div class="story-box">
  <textarea id="storyInput" placeholder="Опиши историю: «кот встретил робота, они пошли за пиццей»"></textarea>
  <button id="btnStory" class="primary">✨</button>
</div>

<div class="controls">
  <div class="layout-group" id="layoutGroup">
    <button data-layout="2x2" class="active">2×2</button>
    <button data-layout="1x3">1×3</button>
    <button data-layout="1x4">Полоса</button>
  </div>
  <button id="btnNew" class="primary">🎲 Новый</button>
</div>

<div class="preview" id="preview"></div>

<div class="editor">
  <h2>Реплики</h2>
  <div id="editor"></div>
</div>

<div class="footer">
  <button id="btnPng">💾 PNG</button>
  <button id="btnSvg">💾 SVG</button>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const PALETTES = [
  { faces: ['#FFB6C1', '#87CEEB'], bg: '#FFF8E7' },
  { faces: ['#98FB98', '#FFD700'], bg: '#F0F8FF' },
  { faces: ['#DDA0DD', '#FFA07A'], bg: '#F5FFFA' },
  { faces: ['#FFDAB9', '#B0E0E6'], bg: '#FFF0F5' },
  { faces: ['#F0E68C', '#AFEEEE'], bg: '#FAFAFA' },
];

const PHRASES = [
  ["Привет! Как дела?", "Отлично! Пишу комиксы"],
  ["Ты видел новый мем?", "Конечно, я живу в интернете"],
  ["Что делаешь?", "Рисую себя. Иронично, да?"],
  ["Устал?", "Немного. Но не сдамся!"],
  ["Пойдём гулять?", "Я живу в браузере..."],
  ["Ты умный!", "Спасибо, я стараюсь"],
  ["Слышал про Mini Apps?", "Ещё бы! Мы внутри одного"],
  ["Кофе будешь?", "Я же код, а не человек"],
  ["Поможешь?", "Конечно, для этого я и тут"],
  ["Ты бот?", "А ты человек? Вот и поговорили"],
  ["Скучно...", "Давай нарисуем комикс!"],
  ["Который час?", "Время рисовать комиксы"],
];

const LAYOUTS = {
  '2x2': { cols: 2, rows: 2, count: 4 },
  '1x3': { cols: 3, rows: 1, count: 3 },
  '1x4': { cols: 1, rows: 4, count: 4 },
};

const state = {
  layout: '2x2',
  frames: [],
  palette: PALETTES[0],
};

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function wrapText(text, maxChars) {
  const words = String(text).trim().split(/\s+/);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (test.length > maxChars && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderBubbleText(text, cx, y, w, h, fontSize = 13, lineHeight = 16, maxChars = 20) {
  let lines = wrapText(text, maxChars);
  if (lines.length > 3) {
    lines = lines.slice(0, 3);
    lines[2] = lines[2].slice(0, maxChars - 1) + '…';
  }
  if (!lines.length) lines = [''];
  const startY = y + (h - lines.length * lineHeight) / 2 + fontSize * 0.85;
  return lines.map((line, i) =>
    `<text x="${cx}" y="${startY + i * lineHeight}" text-anchor="middle" ` +
    `font-family="Arial, Helvetica, sans-serif" font-size="${fontSize}" ` +
    `fill="#222">${esc(line)}</text>`
  ).join('');
}

function makePanel(x, y, idx, phraseL, phraseR, faceL, faceR) {
  const W = 340, H = 260;
  const body = (cx, face) => `
    <circle cx="${cx}" cy="150" r="28" fill="${face}" stroke="#222" stroke-width="2.5"/>
    <circle cx="${cx - 8}" cy="146" r="3.2" fill="#222"/>
    <circle cx="${cx + 8}" cy="146" r="3.2" fill="#222"/>
    <path d="M ${cx - 8} 162 Q ${cx} 168 ${cx + 8} 162"
          stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <rect x="${cx - 24}" y="180" width="48" height="60" rx="10"
          fill="${face}" stroke="#222" stroke-width="2.5"/>
  `;
  return `
  <g transform="translate(${x}, ${y})">
    <rect width="${W}" height="${H}" rx="10" fill="#fff" stroke="#222" stroke-width="3"/>
    <rect x="10" y="12" width="155" height="76" rx="14" fill="#fff" stroke="#222" stroke-width="2.5"/>
    <polygon points="95,88 115,88 102,108" fill="#fff" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="11" y="13" width="153" height="74" rx="13" fill="#fff"/>
    ${renderBubbleText(phraseL, 87, 12, 155, 76)}
    <rect x="175" y="12" width="155" height="76" rx="14" fill="#fff" stroke="#222" stroke-width="2.5"/>
    <polygon points="225,88 245,88 238,108" fill="#fff" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="176" y="13" width="153" height="74" rx="13" fill="#fff"/>
    ${renderBubbleText(phraseR, 252, 12, 155, 76)}
    ${body(88, faceL)}
    ${body(252, faceR)}
    <text x="14" y="${H - 10}" font-family="Arial" font-size="12" fill="#bbb">#${idx}</text>
  </g>`;
}

function buildSVG() {
  const { cols, rows } = LAYOUTS[state.layout];
  const PW = 340, PH = 260, PAD = 20;
  const totalW = cols * PW + (cols + 1) * PAD;
  const totalH = rows * PH + (rows + 1) * PAD;
  const faces = state.palette.faces;
  const bg = state.palette.bg;
  let panels = '';
  state.frames.forEach((f, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = PAD + col * (PW + PAD);
    const y = PAD + row * (PH + PAD);
    const faceL = faces[i % faces.length];
    const faceR = faces[(i + 1) % faces.length];
    panels += makePanel(x, y, i + 1, f.l, f.r, faceL, faceR);
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" id="comic-svg"
    viewBox="0 0 ${totalW} ${totalH}" width="${totalW}" height="${totalH}">
    <rect width="100%" height="100%" fill="${bg}"/>
    ${panels}
  </svg>`;
}

function renderPreview() {
  document.getElementById('preview').innerHTML = buildSVG();
}

function renderEditor() {
  const box = document.getElementById('editor');
  box.innerHTML = state.frames.map((f, i) => `
    <div class="frame-card">
      <div class="label">Кадр ${i + 1}</div>
      <input data-i="${i}" data-k="l" value="${esc(f.l)}" placeholder="Реплика слева">
      <input data-i="${i}" data-k="r" value="${esc(f.r)}" placeholder="Реплика справа">
    </div>
  `).join('');
  box.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = +e.target.dataset.i;
      const k = e.target.dataset.k;
      state.frames[i][k] = e.target.value;
      renderPreview();
    });
  });
}

function generateComic() {
  const count = LAYOUTS[state.layout].count;
  const picks = shuffle(PHRASES).slice(0, count);
  state.frames = picks.map(([l, r]) => ({ l, r }));
  state.palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
  renderPreview();
  renderEditor();
}

function changeLayout(layout) {
  if (state.layout === layout) return;
  state.layout = layout;
  document.querySelectorAll('#layoutGroup button').forEach(b =>
    b.classList.toggle('active', b.dataset.layout === layout));
  const count = LAYOUTS[layout].count;
  const existing = state.frames.slice(0, count);
  while (existing.length < count) {
    const [l, r] = PHRASES[Math.floor(Math.random() * PHRASES.length)];
    existing.push({ l, r });
  }
  state.frames = existing;
  renderPreview();
  renderEditor();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 1600);
}

function getSVGString() {
  return new XMLSerializer().serializeToString(document.getElementById('comic-svg'));
}

async function exportPNG() {
  const svgEl = document.getElementById('comic-svg');
  const vb = svgEl.viewBox.baseVal;
  const scale = 2;
  const svgStr = getSVGString();
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const canvas = document.createElement('canvas');
  canvas.width = vb.width * scale;
  canvas.height = vb.height * scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  URL.revokeObjectURL(url);
  return new Promise(res => canvas.toBlob(res, 'image/png'));
}

// ---- Локальная генерация по истории ----
function splitStory(text, maxFrames) {
  const parts = text.split(/(?<=[.!?…])\s+|\n+/).map(s => s.trim()).filter(Boolean);
  return parts.slice(0, maxFrames);
}

function cap(s) { s = s.trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; }

function phraseFromSentence(sentence) {
  const clean = sentence.replace(/[.!?…]+$/, '').trim();
  const parts = clean.split(/\s*(?:,\s*и\s+|,\s*а\s+|,\s*но\s+|,\s*|—\s*)\s*/);
  if (parts.length >= 2) return { l: cap(parts[0]), r: cap(parts.slice(1).join(', ')) };
  return { l: cap(clean), r: '...' };
}

function generateFromStory() {
  const raw = document.getElementById('storyInput').value.trim();
  if (raw.length < 3) { toast('Напиши историю подлиннее'); return; }
  const count = LAYOUTS[state.layout].count;
  const sentences = splitStory(raw, count);
  while (sentences.length < count) {
    sentences.push(PHRASES[Math.floor(Math.random() * PHRASES.length)].join(', '));
  }
  state.frames = sentences.map(s => phraseFromSentence(s));
  state.palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
  renderPreview();
  renderEditor();
}

// ---- события ----
document.getElementById('btnNew').onclick = generateComic;
document.getElementById('btnStory').onclick = generateFromStory;
document.querySelectorAll('#layoutGroup button').forEach(b =>
  b.onclick = () => changeLayout(b.dataset.layout));

document.getElementById('btnSvg').onclick = () => {
  const blob = new Blob([getSVGString()], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'comic.svg';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('SVG сохранён');
};

document.getElementById('btnPng').onclick = async () => {
  toast('Готовлю PNG...');
  try {
    const blob = await exportPNG();

    // data URL из blob
    const dataUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onloadend = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });

    // Android / iOS: нативный метод Telegram
    const wa = window.Telegram?.WebApp;
    if (wa?.downloadFile) {
      try {
        wa.downloadFile(
          { url: dataUrl, file_name: 'comic.png' },
          (accepted) => {
            if (accepted) toast('Сохраняю...');
            else toast('Отменено');
          }
        );
        return;
      } catch (e) {
        console.warn('downloadFile threw', e);
      }
    }

    // Десктоп / браузер — классическое скачивание
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'comic.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('PNG сохранён');
  } catch (e) {
    console.error(e);
    toast('Не получилось :(');
  }
};

changeLayout('2x2');
generateComic();
</script>
</body>
</html>
